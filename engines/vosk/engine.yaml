id: vosk
name: Vosk (keyword grammar, ASR baseline)
homepage: https://alphacephei.com/vosk/
licence:
  runtime: Apache-2.0
  models: Apache-2.0 (Vosk model zoo)
version: vosk==0.3.44
extra: engines-vosk
adapter: wakewordworld.engines.vosk
models:
- name: vosk-model-small-en-us-0.15
  url: https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
  sha256: 30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498
- name: vosk-model-small-de-0.15
  url: https://alphacephei.com/vosk/models/vosk-model-small-de-0.15.zip
  sha256: unpinned
- name: vosk-model-small-fr-0.22
  url: https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
  sha256: unpinned
- name: vosk-model-small-es-0.42
  url: https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
  sha256: unpinned
wake_words:
- hey jarvis
- alexa
- computer
custom_word_method: text
on_device: true
score_semantics: 'Boolean: 1.0 on the frame where the phrase first appears in the partial/final text of
  the current utterance; final-result appearances carry the minimum per-word confidence.

  '
notes: "Included as an ASR baseline, not as a production wake word engine; latency is bounded by the recogniser's\
  \ endpointing (hundreds of ms to seconds).\n Wake words are grammar phrases set per run; the list above\
  \ is the default configuration."
