name: Takedown request
description: Ask for a recording to be removed from the benchmark
labels: [takedown]
body:
  - type: input
    id: item
    attributes: { label: Item URL or chunk id }
    validations: { required: true }
  - type: textarea
    id: reason
    attributes: { label: Reason }
    validations: { required: true }
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I am the rights holder or act on their behalf
