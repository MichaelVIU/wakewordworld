name: Engine submission

on:
  pull_request:
    paths:
      - "engines/**"
      - "src/wakewordworld/engines/**"
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changed:
    name: Find changed engine folders
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.list.outputs.folders }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          folders=$(git diff --name-only "$base" HEAD -- engines | awk -F/ 'NF>1 {print $1"/"$2}' | sort -u | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "folders=$folders" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.folder }}
    needs: changed
    if: needs.changed.outputs.folders != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.changed.outputs.folders) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync
      - name: Check engine.yaml, DISCLOSURE.md and Dockerfile
        run: uv run python scripts/check_engine_folder.py "${{ matrix.folder }}"
      - name: Adapter unit tests
        run: uv run pytest tests/engines -q

  build:
    name: Build image ${{ matrix.folder }}
    needs: [changed, validate]
    if: needs.changed.outputs.folders != '[]' && (contains(github.event.pull_request.labels.*.name, 'run-eval') || github.event.action != 'labeled')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.changed.outputs.folders) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.folder }}/Dockerfile
          push: false
          load: true
          tags: wakewordworld-${{ matrix.folder }}:pr-${{ github.event.pull_request.number }}
      - name: Print digest
        run: echo "image digest ${{ steps.build.outputs.digest }}"
      - name: Harness smoke test inside the image
        run: |
          engine=$(basename "${{ matrix.folder }}")
          docker run --rm --network none \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            "wakewordworld-${{ matrix.folder }}:pr-${{ github.event.pull_request.number }}" \
            eval engines | tee engines.txt
          grep -q "^$engine$" engines.txt
