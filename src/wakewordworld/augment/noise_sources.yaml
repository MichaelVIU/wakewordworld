# Registry of openly licensed noise and room-impulse-response sets used by the
# augmentation lane. Licences were read from the linked pages on 2026-09-27.
# `download_default: false` sets are listed for completeness but are not fetched by
# `augment noise download` unless --force-unverified is given.
