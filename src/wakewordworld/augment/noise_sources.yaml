  - id: musan
    name: "MUSAN: music, speech and noise corpus"
    kind: noise
    licence: CC-BY-4.0
    licence_evidence: "openslr.org/17: 'License: Attribution 4.0 International (CC BY 4.0)' (read 2026-09-27)"
    url: https://www.openslr.org/17/
    attribution: "MUSAN (Snyder, Chen, Povey 2015), CC BY 4.0, https://www.openslr.org/17/"
    glob: "**/*.wav"
    sample_rate: 16000
    download_default: true
    archives:
      - url: https://www.openslr.org/resources/17/musan.tar.gz
        file: musan.tar.gz
        sha256: unpinned
        size_note: "11 GB"
        categories: []
    path_categories:
      "musan/music/": [music]
      "musan/speech/": [babble]
      "musan/noise/": [noise]

  - id: rirs_noises
    name: "OpenSLR 28: Room Impulse Response and Noise Database (real RIRs from AIR, RWCP, REVERB plus simulated rooms)"
    kind: rir
    licence: Apache-2.0
    licence_evidence: "openslr.org/28: 'License: Apache 2.0' (read 2026-09-27)"
    url: https://www.openslr.org/28/
    attribution: "RIRS_NOISES (Ko et al. 2017), Apache 2.0, https://www.openslr.org/28/"
    glob: "**/real_rirs_isotropic_noises/*.wav"
    sample_rate: 16000
    download_default: true
    archives:
      - url: https://www.openslr.org/resources/28/rirs_noises.zip
        file: rirs_noises.zip
        sha256: unpinned
        size_note: "1.3 GB"
        categories: [real_rir]
    path_categories:
      "RIRS_NOISES/real_rirs_isotropic_noises/": [real_rir]
      "RIRS_NOISES/simulated_rirs/": [simulated_rir]

  - id: but_reverbdb
    name: "BUT Speech@FIT Reverb Database (RIR-only release)"
    kind: rir
    licence: CC-BY-4.0
    licence_evidence: "speech.fit.vutbr.cz: 'The database has CC-BY 4.0 license' (read 2026-09-27)"
    url: https://speech.fit.vutbr.cz/software/but-speech-fit-reverb-database
    attribution: "BUT ReverbDB (Szöke et al. 2019), CC BY 4.0, https://speech.fit.vutbr.cz/software/but-speech-fit-reverb-database"
    glob: "**/RIR/**/*.wav"
    sample_rate: 16000
    download_default: false
    size_note: "8.7 GB; enable explicitly"
    archives:
      - url: https://speech.fit.vutbr.cz/files/BUT_ReverbDB_rel_19_06_RIR-Only.tgz
        file: BUT_ReverbDB_rel_19_06_RIR-Only.tgz
        sha256: unpinned
        categories: [real_rir, office, lecture_room, meeting]

  - id: air
    name: "Aachen Impulse Response Database"
    kind: rir
    licence: MIT
    licence_evidence: "iks.rwth-aachen.de: 'For license information see the included MIT license file' (read 2026-09-27); distributed as a MATLAB package, not directly usable"
    url: https://www.iks.rwth-aachen.de/en/research/tools-downloads/databases/aachen-impulse-response-database/
    attribution: "AIR database (Jeub, Schäfer, Vary 2009), MIT, https://www.iks.rwth-aachen.de/en/research/tools-downloads/databases/aachen-impulse-response-database/"
    glob: "**/*.wav"
    sample_rate: 48000
    download_default: false
    archives: []

  - id: fsd50k
    name: "FSD50K (only CC0 and CC BY clips may be used)"
    kind: noise
    licence: per-item
    licence_evidence: "Zenodo record 4060432: 'Each clip has its own license as defined by the clip uploader'; CC0 19,873 / CC BY 23,506 / CC BY-NC 6,041 clips (read 2026-09-27)"
    url: https://zenodo.org/records/4060432
    attribution: "FSD50K (Fonseca et al. 2022), per-clip CC0/CC BY, https://zenodo.org/records/4060432"
    glob: "**/*.wav"
    sample_rate: 44100
    download_default: false
    size_note: "needs a licence-filter step over FSD50K.metadata; not automated yet"
    archives: []
