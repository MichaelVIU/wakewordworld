id: efficientwordnet
name: EfficientWord-Net
homepage: https://github.com/Ant-Brain/EfficientWord-Net
licence:
  runtime: Apache-2.0
  models: Apache-2.0 (ResNet-50 ArcFace embedding shipped with the package)
version: EfficientWord-Net==1.0.5
extra: engines-ewn
adapter: wakewordworld.engines.efficientwordnet
models:
- name: resnet_50_arc embedding model
  file: bundled in the wheel (eff_word_net/models)
  sha256: unpinned
- name: enrolment reference (.json)
  file: generated by `python -m eff_word_net.generate_reference` from 3-4 recordings
  sha256: unpinned
wake_words:
- hey_michael
custom_word_method: enrolment
on_device: true
score_semantics: >
  Continuous similarity (0-1) between the embedding of the last 1.5 s and the enrolled
  references, evaluated every 0.72 s and held in between.
notes: >
  Few-shot engine: the maintainer enrols each wake word from recordings that are not part
  of the benchmark and records the reference file's hash. The library's own silence gate
  returns no score for quiet windows (reported as 0.0). The `pyaudio` dependency needs
  the PortAudio headers at install time (libportaudio2 / portaudio19-dev).
