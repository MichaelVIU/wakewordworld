notes: >
  75 real research-group meetings with dense first-name vocatives (Jane, Dan, Adam, Morgan,
  Liz, Dave, Chuck). One mixed "interaction" WAV per meeting (all close-talk channels
  summed) plus the original .mrt transcripts (per-segment timing, per-speaker); word
  timings come from forced alignment. Transcript stem (Bmr001) matches the audio stem
  before ".interaction".
